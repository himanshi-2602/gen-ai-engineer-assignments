# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: multistep-reasoning-agent
    runtime: python
    rootDir: multistep-reasoning-agent
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # secret: entered in the Render dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.5-flash-lite
      - key: LLM_MIN_INTERVAL
        value: "6"
      - key: PYTHON_VERSION
        value: "3.12.7"
